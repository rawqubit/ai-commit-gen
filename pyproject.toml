[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-commit-gen"
version = "1.0.0"
description = "AI-powered Git commit message generator based on staged changes."
license = {text = "MIT"}
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
ai-commit-gen = "ai_commit_gen.main:cli"

[tool.setuptools.packages.find]
include = ["ai_commit_gen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
